<style>
:root{color-scheme:light;--paper:#F2F1EE;--sheet:#FFFFFF;--field:#FFFFFF;--ink:#1D1F23;--sub:#464B53;--faint:#5E636B;--rule:#D6D5D0;--blue:#1D4F91;--on-accent:#FFFFFF;--seal:#A3352A;--focus:#1D4F91;--shadow:0 1px 2px rgba(20,22,26,.06),0 8px 24px rgba(20,22,26,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#121417;--sheet:#1A1D21;--field:#15181B;--ink:#E7E5E0;--sub:#B9B6AE;--faint:#9C998F;--rule:#353B42;--blue:#8FB6EC;--on-accent:#0F1A2A;--seal:#F2958A;--focus:#8FB6EC;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28)}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#121417;--sheet:#1A1D21;--field:#15181B;--ink:#E7E5E0;--sub:#B9B6AE;--faint:#9C998F;--rule:#353B42;--blue:#8FB6EC;--on-accent:#0F1A2A;--seal:#F2958A;--focus:#8FB6EC;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.card{width:min(100%,25rem);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:30px 28px;box-shadow:var(--shadow);display:grid;gap:14px}
.eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--faint)}
h1{margin:0;font-family:"Hahmlet","Noto Serif KR","Batang",serif;font-size:1.6rem;line-height:1.3}
.hint{margin:0;color:var(--sub);font-size:.95rem}
input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--field);color:var(--ink)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.keep{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--sub)}
button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--blue);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{margin:0;min-height:1.5em;font-size:.92rem;color:var(--seal)}
.legal{margin:0;font-size:.8rem;line-height:1.6;color:var(--faint);border-top:1px solid var(--rule);padding-top:12px}
.legal a{color:var(--blue);font-weight:700}
</style>

function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
