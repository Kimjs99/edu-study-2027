<head>
<meta charset="utf-8">

<title>스터디 노트</title>
<style>
:root{color-scheme:light;--paper:#EFEBE2;--sheet:#FBF9F4;--ink:#2A2925;--sub:#57534B;--faint:#6E685C;--rule:#D9D2C4;--blue:#1F4C88;--seal:#A8382C}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.card{width:min(100%,25rem);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:30px 28px;box-shadow:0 1px 2px rgba(70,58,35,.07),0 10px 30px rgba(70,58,35,.07);display:grid;gap:14px}
.eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--faint)}
h1{margin:0;font-family:"Hahmlet","Noto Serif KR","Batang",serif;font-size:1.6rem;line-height:1.3}
.hint{margin:0;color:var(--sub);font-size:.95rem}
input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.keep{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--sub)}
button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{margin:0;min-height:1.5em;font-size:.92rem;color:var(--seal)}
</style>
</head>

function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
